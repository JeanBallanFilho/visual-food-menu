name: Supabase Heartbeat

on:
  schedule:
    # Technical heartbeat only. Runs once per day in UTC.
    - cron: "17 7 * * *"
  workflow_dispatch:

jobs:
  heartbeat:
    name: Technical heartbeat
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run isolated Supabase heartbeat
        run: node scripts/supabase-heartbeat.mjs
